<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="AutoPwn AI">
<title>AutoPwn AI</title>
<defs>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#4ADE80" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4ADE80" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#4ADE80" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="900" height="300" rx="18"/></clipPath>
  <clipPath id="typing"><rect class="typer" x="340" y="86" width="410" height="88"/></clipPath>
</defs>
<style>
  .px { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  .antenna { animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards, twitch 2.4s ease-in-out 2.2s infinite; }
  .frame { opacity: 0; animation: fade .6s ease-out .05s forwards; }
  .bug { animation: glow 3s ease-in-out 2s infinite; }
  .typer { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 1.4s steps(7) 1.1s forwards; }
  .cursor { opacity: 0; animation: blink 1s steps(1) 1.1s infinite; }
  .cursor-move { animation: slide 1.4s steps(7) 1.1s forwards; }
  .sweep { animation: sweep 4.5s linear 1s infinite; }
  .tag { opacity: 0; animation: fade .8s ease-out 2.5s forwards; }
  .sub { opacity: 0; animation: fade .8s ease-out 2.9s forwards; }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes type { to { transform: scaleX(1); } }
  @keyframes slide { to { transform: translateX(410px); } }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes twitch { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-14deg); } 86% { transform: rotate(12deg); } }
  @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 #4ADE8000); } 50% { filter: drop-shadow(0 0 10px #4ADE80aa); } }
  @keyframes sweep { 0% { transform: translateY(-120px); } 100% { transform: translateY(340px); } }
  @media (prefers-reduced-motion: reduce) {
    .px, .frame, .tag, .sub { animation: none; opacity: 1; }
    .typer { animation: none; transform: none; }
    .cursor, .sweep, .bug, .antenna { animation: none; }
  }
</style>
<g clip-path="url(#card)">
  <rect width="900" height="300" fill="#0B0D0C"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <rect class="sweep" x="0" y="0" width="900" height="90" fill="url(#scan)"/>
  <g><rect x="150" y="70" width="20" height="10" fill="#8A938D" class="frame"/><rect x="280" y="70" width="20" height="10" fill="#8A938D" class="frame"/><rect x="150" y="80" width="10" height="110" fill="#8A938D" class="frame"/><rect x="290" y="80" width="10" height="110" fill="#8A938D" class="frame"/><rect x="150" y="190" width="20" height="10" fill="#8A938D" class="frame"/><rect x="280" y="190" width="20" height="10" fill="#8A938D" class="frame"/></g>
  <g class="bug"><rect x="190" y="90" width="10" height="10" fill="#4ADE80" class="px antenna" style="animation-delay:0.150s"/><rect x="250" y="90" width="10" height="10" fill="#4ADE80" class="px antenna" style="animation-delay:0.185s"/><rect x="200" y="100" width="10" height="10" fill="#4ADE80" class="px antenna" style="animation-delay:0.220s"/><rect x="240" y="100" width="10" height="10" fill="#4ADE80" class="px antenna" style="animation-delay:0.255s"/><rect x="210" y="110" width="30" height="10" fill="#4ADE80" class="px" style="animation-delay:0.290s"/><rect x="180" y="120" width="10" height="10" fill="#4ADE80" class="px" style="animation-delay:0.325s"/><rect x="200" y="120" width="50" height="10" fill="#4ADE80" class="px" style="animation-delay:0.360s"/><rect x="260" y="120" width="10" height="10" fill="#4ADE80" class="px" style="animation-delay:0.395s"/><rect x="190" y="130" width="30" height="10" fill="#4ADE80" class="px" style="animation-delay:0.430s"/><rect x="230" y="130" width="30" height="10" fill="#4ADE80" class="px" style="animation-delay:0.465s"/><rect x="180" y="140" width="40" height="10" fill="#4ADE80" class="px" style="animation-delay:0.500s"/><rect x="230" y="140" width="40" height="10" fill="#4ADE80" class="px" style="animation-delay:0.535s"/><rect x="190" y="150" width="30" height="10" fill="#4ADE80" class="px" style="animation-delay:0.570s"/><rect x="230" y="150" width="30" height="10" fill="#4ADE80" class="px" style="animation-delay:0.605s"/><rect x="180" y="160" width="10" height="10" fill="#4ADE80" class="px" style="animation-delay:0.640s"/><rect x="200" y="160" width="20" height="10" fill="#4ADE80" class="px" style="animation-delay:0.675s"/><rect x="230" y="160" width="20" height="10" fill="#4ADE80" class="px" style="animation-delay:0.710s"/><rect x="260" y="160" width="10" height="10" fill="#4ADE80" class="px" style="animation-delay:0.745s"/><rect x="200" y="170" width="50" height="10" fill="#4ADE80" class="px" style="animation-delay:0.780s"/></g>
  <g clip-path="url(#typing)"><rect x="470" y="90" width="10" height="10" fill="#8A938D"/><rect x="470" y="100" width="10" height="10" fill="#8A938D"/><rect x="350" y="110" width="30" height="10" fill="#8A938D"/><rect x="400" y="110" width="10" height="10" fill="#8A938D"/><rect x="440" y="110" width="10" height="10" fill="#8A938D"/><rect x="460" y="110" width="40" height="10" fill="#8A938D"/><rect x="530" y="110" width="30" height="10" fill="#8A938D"/><rect x="380" y="120" width="10" height="10" fill="#8A938D"/><rect x="400" y="120" width="10" height="10" fill="#8A938D"/><rect x="440" y="120" width="10" height="10" fill="#8A938D"/><rect x="470" y="120" width="10" height="10" fill="#8A938D"/><rect x="520" y="120" width="10" height="10" fill="#8A938D"/><rect x="560" y="120" width="10" height="10" fill="#8A938D"/><rect x="350" y="130" width="40" height="10" fill="#8A938D"/><rect x="400" y="130" width="10" height="10" fill="#8A938D"/><rect x="440" y="130" width="10" height="10" fill="#8A938D"/><rect x="470" y="130" width="10" height="10" fill="#8A938D"/><rect x="520" y="130" width="10" height="10" fill="#8A938D"/><rect x="560" y="130" width="10" height="10" fill="#8A938D"/><rect x="340" y="140" width="10" height="10" fill="#8A938D"/><rect x="380" y="140" width="10" height="10" fill="#8A938D"/><rect x="400" y="140" width="10" height="10" fill="#8A938D"/><rect x="430" y="140" width="20" height="10" fill="#8A938D"/><rect x="470" y="140" width="10" height="10" fill="#8A938D"/><rect x="500" y="140" width="10" height="10" fill="#8A938D"/><rect x="520" y="140" width="10" height="10" fill="#8A938D"/><rect x="560" y="140" width="10" height="10" fill="#8A938D"/><rect x="350" y="150" width="40" height="10" fill="#8A938D"/><rect x="410" y="150" width="20" height="10" fill="#8A938D"/><rect x="440" y="150" width="10" height="10" fill="#8A938D"/><rect x="480" y="150" width="20" height="10" fill="#8A938D"/><rect x="530" y="150" width="30" height="10" fill="#8A938D"/><rect x="580" y="11